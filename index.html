<!doctype html>
<html lang="en" class="light" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- App Title -->
    <title>OrderNest — Restaurant Management Platform</title>
    <meta name="description" content="Complete Restaurant Management System - POS, Billing, Kitchen Display, Orders & More" />
    <meta name="author" content="OrderNest" />
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OrderNest" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/ordernest-logo.png?v=4" />
    <link rel="apple-touch-icon" sizes="192x192" href="/ordernest-logo.png?v=4" />
    <link rel="apple-touch-icon" sizes="512x512" href="/ordernest-logo.png?v=4" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/ordernest-logo.png?v=4" />
    <link rel="shortcut icon" href="/ordernest-logo.png?v=4" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="OrderNest - Restaurant Management System" />
    <meta property="og:description" content="Complete Restaurant Management System - POS, Billing, Kitchen Display, Orders & More" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512x512.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@OrderNest" />
    <meta name="twitter:title" content="OrderNest" />
    <meta name="twitter:description" content="Complete Restaurant Management System" />
    <meta name="twitter:image" content="/icon-512x512.png" />
  </head>

  <body style="background-color: #FEFBF8; color: #0A0A0A;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
