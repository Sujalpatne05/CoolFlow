services:
  # Backend API Server
  - type: web
    name: hotel-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server/prod/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_MRGW9S4TjHgQ@ep-aged-hat-ax6m7g0k-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        value: your_jwt_secret_change_this_in_production_2024
      - key: SUPERADMIN_EMAIL
        value: superadmin@ordernest.com
      - key: SUPERADMIN_PASSWORD
        value: super123
    
  # Frontend Static Site
  - type: web
    name: hotel-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://hotel-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
