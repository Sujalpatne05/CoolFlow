<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Turquoise circular background -->
  <circle cx="100" cy="100" r="100" fill="#1DE9B6"/>
  
  <!-- Dark D shape with 3D effect -->
  <g fill="#2C3E50">
    <!-- Left vertical bar (thick) -->
    <path d="M 55 75 L 95 55 L 95 145 L 55 125 Z"/>
    
    <!-- Top horizontal bar -->
    <path d="M 55 75 L 95 55 L 135 75 L 95 95 Z"/>
    
    <!-- Right curved outer edge (D curve) -->
    <path d="M 135 75 Q 165 75 165 100 Q 165 140 135 145 L 95 125 Q 115 130 135 130 Q 155 130 155 100 Q 155 85 135 85 L 95 95 Z"/>
    
    <!-- Bottom horizontal bar -->
    <path d="M 55 125 L 95 145 L 135 125 L 95 105 Z"/>
    
    <!-- Inner left corner detail -->
    <path d="M 70 95 L 95 80 L 95 120 L 70 105 Z"/>
  </g>
  
  <!-- Small dark square accent (bottom left) -->
  <rect x="40" y="135" width="25" height="25" fill="#2C3E50" rx="2"/>
</svg>
